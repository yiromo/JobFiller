services:
  core:
    build: ./core
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./core/.env
    volumes:
      - core_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  telegram-sync:
    build: ./core
    env_file:
      - ./core/.env
    volumes:
      - core_data:/app/data
    depends_on:
      core:
        condition: service_healthy
    command: ["sh", "-c", "while true; do uv run --no-sync python manage.py sync_telegram_jobs; sleep 21600; done"]
    restart: unless-stopped

volumes:
  core_data:
