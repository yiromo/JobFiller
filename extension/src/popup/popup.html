<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Job Filler</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Job Filler</h1>
    <p id="status">Ready.</p>

    <div class="cv-row">
      <select id="cv-select">
        <option value="">No CV selected</option>
      </select>
      <button
        id="manage-cvs-btn"
        type="button"
        class="icon-btn"
        title="Manage CVs & Settings"
        aria-label="Manage CVs & Settings"
      >
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
          <path
            d="M19.14 12.94a7.14 7.14 0 0 0 .06-.94 7.14 7.14 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.62-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.32.6.22l2.39-.96c.49.38 1.03.7 1.62.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.24.1.5 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"
          />
        </svg>
      </button>
    </div>

    <div class="actions">
      <button id="scan-btn" type="button">Scan this page</button>
      <button id="fill-btn" type="button" disabled>Fill application</button>
    </div>
    <div class="actions">
      <button id="generate-cl-btn" type="button" disabled>Generate Cover Letter</button>
    </div>
    <textarea id="cover-letter-preview" readonly hidden></textarea>
    <pre id="log"></pre>
    <script src="popup.js"></script>
  </body>
</html>
